name: ML Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-run-pipeline:
    runs-on: ubuntu-latest

    # dataset เต็มไม่ได้อยู่บน GitHub — CI ใช้ dataset/sample (ภาพตัวอย่างไม่กี่ MB)
    env:
      DATA_DIR: dataset/sample
      MODELS: logreg,svc_rbf
      MIN_VAL_ACCURACY: "0.40"   # sample เล็ก เกณฑ์จึงต่ำกว่าตอนเทรนเต็ม (0.70)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Create dummy data for CI test
        run: |
          mkdir -p processed_data
          python -c "import numpy as np; np.savez('processed_data/train.npz', X=np.zeros((10, 2276)), y=np.zeros(10)); np.savez('processed_data/val.npz', X=np.zeros((5, 2276)), y=np.zeros(5)); np.savez('processed_data/test.npz', X=np.zeros((5, 2276)), y=np.zeros(5))"

      - name: Unit tests
        run: pytest -v

      - name: 01 - Data validation
        run: python scripts/01_data_validation.py

      - name: 02 - Data preprocessing
        run: python scripts/02_data_preprocessing.py

      - name: 03 - Train, evaluate, register
        run: python scripts/03_train_evaluate_register.py

      - name: 04 - Load model and predict
        run: python scripts/04_load_and_predict.py

      - name: Upload MLflow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-results
          path: |
            mlflow.db
            mlruns/
          if-no-files-found: ignore